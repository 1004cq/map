<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#e8eaed" />
  <title>map.cq.je</title>
  <!-- MapLibre GL JS -->
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <style>
    :root {
      --bg: #e8eaed;
      --text: #202124;
      --muted: #5f6368;
      --border: #dadce0;
      --surface: #fff;
      --surface-2: #f1f3f4;
      --blue: #1a73e8;
      --shadow: 0 1px 3px rgba(60, 64, 67, 0.28);
      --radius: 4px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left, 0px);
      --safe-r: env(safe-area-inset-right, 0px);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: var(--font);
      color: var(--text);
      background: var(--bg);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    /* 容器背景：首屏减空白 */
    #map {
      position: absolute;
      inset: 0;
      background: var(--bg);
    }

    .maplibregl-ctrl-attrib {
      font-size: 10px !important;
      background: rgba(255, 255, 255, 0.7) !important;
    }

    .maplibregl-ctrl-bottom-left .maplibregl-ctrl {
      margin: 0 0 52px 8px;
    }

    .ui {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .ui > * { pointer-events: auto; }

    .brand {
      position: absolute;
      top: calc(10px + var(--safe-t));
      left: calc(10px + var(--safe-l));
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      user-select: none;
      pointer-events: none;
    }

    .search-wrap {
      position: absolute;
      top: calc(10px + var(--safe-t));
      left: 50%;
      transform: translateX(-50%);
      width: min(400px, calc(100vw - 24px - var(--safe-l) - var(--safe-r)));
    }

    .search-box {
      display: flex;
      align-items: center;
      height: 40px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .search-box:focus-within { border-color: var(--blue); }

    .search-box input {
      flex: 1;
      min-width: 0;
      height: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      padding: 0 12px;
      font: 400 14px/1.3 var(--font);
      color: var(--text);
    }

    .search-box input::placeholder { color: #80868b; }

    .search-box .btn-icon,
    .search-box .btn-go {
      flex-shrink: 0;
      height: 100%;
      border: 0;
      border-left: 1px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      color: var(--muted);
      font: 500 13px var(--font);
    }

    .search-box .btn-icon {
      width: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .search-box .btn-icon:hover,
    .search-box .btn-go:hover {
      background: var(--surface-2);
      color: var(--text);
    }

    .search-box .btn-go {
      padding: 0 14px;
      color: var(--blue);
    }

    .search-box .btn-icon:disabled { opacity: 0.4; cursor: not-allowed; }
    .search-box svg { width: 18px; height: 18px; }

    .search-results {
      display: none;
      margin-top: 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      max-height: min(260px, 40vh);
      overflow-y: auto;
    }

    .search-results.open { display: block; }

    .search-item {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      border-bottom: 1px solid #eee;
      background: transparent;
      padding: 10px 12px;
      font: 400 13px/1.35 var(--font);
      color: var(--text);
      cursor: pointer;
    }

    .search-item:last-child { border-bottom: 0; }
    .search-item:hover,
    .search-item:focus { background: #f8f9fa; outline: 0; }
    .search-item:disabled { color: var(--muted); cursor: default; }
    .search-item small {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
    }

    .map-type {
      position: absolute;
      left: 50%;
      bottom: calc(12px + var(--safe-b));
      transform: translateX(-50%);
      display: flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .map-type button {
      border: 0;
      background: transparent;
      color: var(--muted);
      font: 500 13px var(--font);
      padding: 8px 14px;
      cursor: pointer;
      white-space: nowrap;
    }

    .map-type button + button { border-left: 1px solid var(--border); }
    .map-type button:hover { background: var(--surface-2); color: var(--text); }
    .map-type button.active {
      background: var(--blue);
      color: #fff;
    }

    .coord-toast {
      position: absolute;
      left: 50%;
      bottom: calc(56px + var(--safe-b));
      transform: translateX(-50%);
      max-width: min(90vw, 340px);
      padding: 8px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      font: 400 13px/1.4 var(--font);
      color: var(--text);
      text-align: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.15s;
      z-index: 5;
    }

    .coord-toast.show {
      opacity: 1;
      visibility: visible;
    }

    .coord-toast strong {
      font-weight: 600;
      color: var(--blue);
    }

    .loading {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--bg);
      transition: opacity 0.25s, visibility 0.25s;
    }

    .loading.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading strong {
      font-weight: 500;
      font-size: 14px;
      color: var(--muted);
    }

    .loading-bar {
      width: 72px;
      height: 2px;
      background: #dadce0;
      overflow: hidden;
    }

    .loading-bar::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      background: var(--blue);
      animation: slide 0.9s linear infinite;
    }

    .loading p {
      font-size: 12px;
      color: var(--muted);
    }

    @keyframes slide {
      from { transform: translateX(-120%); }
      to { transform: translateX(300%); }
    }

    @media (max-width: 640px) {
      .brand { display: none; }
      .search-wrap {
        width: calc(100vw - 20px - var(--safe-l) - var(--safe-r));
      }
      .map-type button { padding: 8px 12px; font-size: 12px; }
      .maplibregl-ctrl-bottom-left .maplibregl-ctrl {
        margin-bottom: 48px;
      }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="loading" id="loading">
    <strong>map.cq.je</strong>
    <div class="loading-bar"></div>
    <p>加载中…</p>
  </div>

  <div class="ui">
    <div class="brand">map.cq.je</div>

    <div class="search-wrap">
      <form class="search-box" id="searchForm" autocomplete="off">
        <input id="searchInput" type="search" placeholder="搜索地点" enterkeyhint="search" aria-label="搜索地点" />
        <button type="button" class="btn-icon" id="locateBtn" title="定位" aria-label="定位当前位置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="3" />
            <path d="M12 3v2M12 19v2M3 12h2M19 12h2" />
            <circle cx="12" cy="12" r="8" />
          </svg>
        </button>
        <button type="submit" class="btn-go">搜索</button>
      </form>
      <div class="search-results" id="searchResults" role="listbox"></div>
    </div>

    <nav class="map-type" aria-label="地图类型">
      <button type="button" data-layer="streets" class="active">街道</button>
      <button type="button" data-layer="satellite">卫星</button>
      <button type="button" data-layer="hybrid">混合</button>
    </nav>

    <div class="coord-toast" id="coordToast" role="status"></div>
  </div>

  <script>
    (function () {
      "use strict";

      // ========== 配置 ==========
      const ESRI_API_KEY = "YOUR_ESRI_API_KEY";
      // OpenFreeMap 矢量街道（无需 Key）
      const STREETS_STYLE = "https://tiles.openfreemap.org/styles/liberty";

      const loadingEl = document.getElementById("loading");
      const coordToast = document.getElementById("coordToast");
      let toastTimer = null;
      let loadingHidden = false;
      let marker = null;
      let activeLayer = "streets";
      let hybridStylePromise = null;
      let libertyStyleCache = null;

      function showToast(html, ms) {
        coordToast.innerHTML = html;
        coordToast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          coordToast.classList.remove("show");
        }, ms || 4000);
      }

      function hideLoading() {
        if (loadingHidden) return;
        loadingHidden = true;
        loadingEl.classList.add("hide");
      }

      function esriImageryTiles() {
        const hasKey = ESRI_API_KEY && ESRI_API_KEY !== "YOUR_ESRI_API_KEY";
        if (hasKey) {
          return [
            "https://ibasemaps-api.arcgis.com/arcgis/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}?token=" +
              encodeURIComponent(ESRI_API_KEY),
          ];
        }
        return [
          "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        ];
      }

      function satelliteStyle() {
        return {
          version: 8,
          name: "esri-satellite",
          sources: {
            esri: {
              type: "raster",
              tiles: esriImageryTiles(),
              tileSize: 256,
              attribution: "© Esri",
              maxzoom: 19,
            },
          },
          layers: [
            {
              id: "esri-satellite",
              type: "raster",
              source: "esri",
              minzoom: 0,
              maxzoom: 22,
            },
          ],
        };
      }

      function fetchLibertyStyle() {
        if (libertyStyleCache) return Promise.resolve(libertyStyleCache);
        return fetch(STREETS_STYLE)
          .then(function (res) {
            if (!res.ok) throw new Error("style fetch failed");
            return res.json();
          })
          .then(function (json) {
            libertyStyleCache = json;
            return json;
          });
      }

      // 混合：Esri 卫星 + OpenFreeMap 道路线/注记
      function getHybridStyle() {
        if (hybridStylePromise) return hybridStylePromise;
        hybridStylePromise = fetchLibertyStyle().then(function (base) {
          var layers = [
            {
              id: "esri-satellite",
              type: "raster",
              source: "esri",
              minzoom: 0,
              maxzoom: 22,
            },
          ];

          base.layers.forEach(function (layer) {
            var id = layer.id || "";
            var keepSymbol = layer.type === "symbol";
            var keepRoad =
              layer.type === "line" &&
              /transportation|highway|road|bridge|ferry/.test(id) &&
              !/tunnel/.test(id);
            if (!keepSymbol && !keepRoad) return;

            var clone = JSON.parse(JSON.stringify(layer));
            if (keepRoad && clone.paint) {
              // 卫星上提高道路可读性
              if (clone.paint["line-color"] !== undefined) {
                clone.paint["line-color"] = "#ffffff";
              }
              clone.paint["line-opacity"] =
                typeof clone.paint["line-opacity"] === "number"
                  ? Math.max(clone.paint["line-opacity"], 0.55)
                  : 0.65;
            }
            if (keepSymbol && clone.paint) {
              if (clone.paint["text-halo-color"] === undefined) {
                clone.paint["text-halo-color"] = "#000000";
              }
              if (clone.paint["text-halo-width"] === undefined) {
                clone.paint["text-halo-width"] = 1.2;
              }
            }
            layers.push(clone);
          });

          return {
            version: 8,
            name: "hybrid",
            glyphs: base.glyphs,
            sprite: base.sprite,
            sources: {
              esri: {
                type: "raster",
                tiles: esriImageryTiles(),
                tileSize: 256,
                attribution: "© Esri",
                maxzoom: 19,
              },
              openmaptiles: base.sources.openmaptiles,
            },
            layers: layers,
          };
        });
        return hybridStylePromise;
      }

      // ========== 地图：街道优先首屏 ==========
      var map = new maplibregl.Map({
        container: "map",
        style: STREETS_STYLE,
        center: [104.06, 30.67],
        zoom: 3.2,
        attributionControl: true,
        // 移动端手势：默认捏合缩放、拖拽、旋转
        dragRotate: true,
        touchPitch: true,
        pitchWithRotate: true,
        fadeDuration: 0,
        maxTileCacheSize: 80,
      });

      map.addControl(
        new maplibregl.NavigationControl({ showCompass: true, visualizePitch: true }),
        "bottom-right"
      );
      map.addControl(new maplibregl.ScaleControl({ maxWidth: 100 }), "bottom-left");

      map.once("load", hideLoading);
      // 兜底：避免长时间遮罩
      setTimeout(hideLoading, 2500);

      map.on("error", function (e) {
        console.warn(e && e.error ? e.error : e);
      });

      function setMarker(lng, lat, label) {
        if (marker) marker.remove();
        var el = document.createElement("div");
        el.style.cssText =
          "width:12px;height:12px;border-radius:50%;background:#ea4335;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.35);";
        marker = new maplibregl.Marker({ element: el })
          .setLngLat([lng, lat])
          .addTo(map);
        if (label) {
          marker.setPopup(
            new maplibregl.Popup({ offset: 12, closeButton: false }).setText(label)
          );
        }
      }

      function flyTo(lng, lat, label) {
        map.flyTo({
          center: [lng, lat],
          zoom: Math.max(map.getZoom(), 14),
          essential: true,
          duration: 1200,
        });
        var short = label ? String(label).split(",")[0] : "";
        setMarker(lng, lat, short);
        if (short) showToast("<strong>" + short + "</strong>");
      }

      function resolveStyle(key) {
        if (key === "streets") return Promise.resolve(STREETS_STYLE);
        if (key === "satellite") return Promise.resolve(satelliteStyle());
        return getHybridStyle();
      }

      function switchLayer(key) {
        if (key === activeLayer) return;
        var prev = activeLayer;
        activeLayer = key;
        document.querySelectorAll("[data-layer]").forEach(function (btn) {
          btn.classList.toggle("active", btn.getAttribute("data-layer") === key);
        });

        // 卫星/混合时容器偏深色，街道偏浅灰
        document.getElementById("map").style.background =
          key === "streets" ? "#e8eaed" : "#1a2330";

        resolveStyle(key)
          .then(function (style) {
            map.setStyle(style);
          })
          .catch(function (err) {
            console.error(err);
            activeLayer = prev;
            document.querySelectorAll("[data-layer]").forEach(function (btn) {
              btn.classList.toggle("active", btn.getAttribute("data-layer") === prev);
            });
            showToast("图层切换失败");
          });
      }

      document.querySelectorAll("[data-layer]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          switchLayer(btn.getAttribute("data-layer"));
        });
      });

      // ========== 点击坐标 ==========
      map.on("click", function (e) {
        var lng = e.lngLat.lng;
        var lat = e.lngLat.lat;
        setMarker(lng, lat);
        showToast(
          "<strong>坐标</strong><br/>" + lng.toFixed(6) + ", " + lat.toFixed(6)
        );
      });

      // ========== Nominatim 搜索 ==========
      var searchForm = document.getElementById("searchForm");
      var searchInput = document.getElementById("searchInput");
      var searchResults = document.getElementById("searchResults");
      var searchAbort = null;
      var debounceTimer = null;

      function closeResults() {
        searchResults.classList.remove("open");
        searchResults.innerHTML = "";
      }

      function renderResults(items) {
        searchResults.innerHTML = "";
        if (!items.length) {
          searchResults.innerHTML =
            '<button type="button" class="search-item" disabled>无结果</button>';
          searchResults.classList.add("open");
          return;
        }
        items.forEach(function (item) {
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "search-item";
          btn.setAttribute("role", "option");
          var name = item.display_name.split(",")[0];
          btn.innerHTML = name + "<small>" + item.display_name + "</small>";
          btn.addEventListener("click", function () {
            flyTo(parseFloat(item.lon), parseFloat(item.lat), item.display_name);
            closeResults();
            searchInput.blur();
          });
          searchResults.appendChild(btn);
        });
        searchResults.classList.add("open");
      }

      function doSearch(q) {
        if (!q || q.trim().length < 2) {
          closeResults();
          return;
        }
        if (searchAbort) searchAbort.abort();
        searchAbort = new AbortController();
        fetch(
          "https://nominatim.openstreetmap.org/search?format=json&limit=6&q=" +
            encodeURIComponent(q.trim()),
          {
            signal: searchAbort.signal,
            headers: { Accept: "application/json" },
          }
        )
          .then(function (res) {
            if (!res.ok) throw new Error("search failed");
            return res.json();
          })
          .then(renderResults)
          .catch(function (e) {
            if (e.name !== "AbortError") showToast("搜索失败，请稍后重试");
          });
      }

      searchForm.addEventListener("submit", function (e) {
        e.preventDefault();
        doSearch(searchInput.value);
      });

      searchInput.addEventListener("input", function () {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(function () {
          doSearch(searchInput.value);
        }, 380);
      });

      document.addEventListener("click", function (e) {
        if (!e.target.closest(".search-wrap")) closeResults();
      });

      // ========== 定位 ==========
      var locateBtn = document.getElementById("locateBtn");
      locateBtn.addEventListener("click", function () {
        if (!navigator.geolocation) {
          showToast("浏览器不支持定位");
          return;
        }
        locateBtn.disabled = true;
        showToast("正在定位…", 8000);
        navigator.geolocation.getCurrentPosition(
          function (pos) {
            locateBtn.disabled = false;
            flyTo(pos.coords.longitude, pos.coords.latitude, "我的位置");
          },
          function () {
            locateBtn.disabled = false;
            showToast("定位失败，请检查权限");
          },
          { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 }
        );
      });

      // 预取 OpenFreeMap style，加速混合图切换
      fetchLibertyStyle().catch(function () {});

      window.__mapApp = {
        map: map,
        switchLayer: switchLayer,
        flyTo: flyTo,
        showToast: showToast,
      };
    })();
  </script>
</body>
</html>
