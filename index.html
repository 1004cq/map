<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a1628" />
  <title>map.cq.je — 3D 地球地图</title>
  <link rel="preconnect" href="https://cesium.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet" />
  <!-- CesiumJS CDN -->
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.124/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.124/Build/Cesium/Cesium.js"></script>
  <style>
    :root {
      --bg-void: #0a1628;
      --panel: rgba(12, 28, 48, 0.78);
      --panel-border: rgba(140, 190, 220, 0.22);
      --text: #e8f1f8;
      --text-muted: rgba(200, 220, 235, 0.72);
      --accent: #3db8a0;
      --accent-hover: #52d4ba;
      --danger: #e8786a;
      --radius: 14px;
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      --font-display: "Outfit", sans-serif;
      --font-body: "Source Sans 3", sans-serif;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: var(--font-body);
      color: var(--text);
      background: var(--bg-void);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    /* 容器背景色：首屏出球前避免大面积空白（参照 Cesium Performance 示例思路） */
    #cesiumContainer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(ellipse 80% 60% at 50% 40%, #163a5c 0%, transparent 55%),
        radial-gradient(ellipse 100% 100% at 50% 100%, #061018 0%, var(--bg-void) 70%);
    }

    .cesium-viewer-bottom,
    .cesium-viewer-animationContainer,
    .cesium-viewer-timelineContainer,
    .cesium-viewer-fullscreenContainer,
    .cesium-viewer-vrContainer {
      display: none !important;
    }

    .cesium-viewer-toolbar {
      display: none !important;
    }

    .cesium-credit-logoContainer,
    .cesium-credit-textContainer {
      opacity: 0.55;
      transform: scale(0.85);
      transform-origin: bottom left;
    }

    /* —— UI —— */
    .ui {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    .ui > * { pointer-events: auto; }

    .top-bar {
      position: absolute;
      top: calc(12px + var(--safe-top));
      left: calc(12px + var(--safe-left));
      right: calc(12px + var(--safe-right));
      display: flex;
      align-items: center;
      gap: 10px;
      animation: slideDown 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .brand {
      flex-shrink: 0;
      display: flex;
      align-items: baseline;
      gap: 6px;
      padding: 10px 14px;
      background: var(--panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .brand-name {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .brand-tag {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .search-wrap {
      flex: 1;
      min-width: 0;
      position: relative;
      max-width: 420px;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 4px 4px 14px;
      background: var(--panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-box:focus-within {
      border-color: rgba(61, 184, 160, 0.55);
      box-shadow: 0 0 0 3px rgba(61, 184, 160, 0.15), var(--shadow);
    }

    .search-box input {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      font: 500 0.95rem/1.4 var(--font-body);
      padding: 8px 0;
    }

    .search-box input::placeholder { color: var(--text-muted); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: none;
      cursor: pointer;
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 0.875rem;
      color: var(--text);
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 9px 12px;
      transition: background 0.18s, transform 0.15s, color 0.18s;
      white-space: nowrap;
      user-select: none;
    }

    .btn:hover { background: rgba(255, 255, 255, 0.14); }
    .btn:active { transform: scale(0.96); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    .btn-accent {
      background: var(--accent);
      color: #06241e;
    }
    .btn-accent:hover { background: var(--accent-hover); }

    .btn-icon {
      width: 40px;
      height: 40px;
      padding: 0;
      border-radius: 10px;
      flex-shrink: 0;
    }

    .btn-icon svg { width: 18px; height: 18px; }

    .search-results {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      max-height: min(280px, 40vh);
      overflow-y: auto;
      background: var(--panel);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: none;
      z-index: 20;
    }

    .search-results.open { display: block; animation: fadeUp 0.2s ease both; }

    .search-item {
      width: 100%;
      text-align: left;
      padding: 11px 14px;
      border: none;
      background: transparent;
      color: var(--text);
      font: 500 0.9rem/1.35 var(--font-body);
      cursor: pointer;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      transition: background 0.15s;
    }

    .search-item:last-child { border-bottom: none; }
    .search-item:hover,
    .search-item:focus { background: rgba(61, 184, 160, 0.12); outline: none; }
    .search-item small {
      display: block;
      margin-top: 2px;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 400;
    }

    .controls {
      position: absolute;
      top: calc(72px + var(--safe-top));
      right: calc(12px + var(--safe-right));
      display: flex;
      flex-direction: column;
      gap: 8px;
      animation: slideInRight 0.5s 0.1s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .panel {
      background: var(--panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .panel-label {
      font-family: var(--font-display);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 2px 4px 4px;
    }

    .layer-btn {
      justify-content: flex-start;
      padding: 9px 12px;
      width: 148px;
    }

    .layer-btn.active {
      background: rgba(61, 184, 160, 0.22);
      color: var(--accent-hover);
      box-shadow: inset 0 0 0 1px rgba(61, 184, 160, 0.35);
    }

    .layer-btn .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.35;
      flex-shrink: 0;
    }

    .layer-btn.active .dot { opacity: 1; }

    .coord-toast {
      position: absolute;
      left: 50%;
      bottom: calc(24px + var(--safe-bottom));
      transform: translateX(-50%) translateY(12px);
      max-width: min(92vw, 420px);
      padding: 12px 16px;
      background: var(--panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      font-size: 0.88rem;
      line-height: 1.45;
      text-align: center;
    }

    .coord-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    .coord-toast strong {
      font-family: var(--font-display);
      font-weight: 600;
      color: var(--accent-hover);
    }

    .hint {
      position: absolute;
      left: calc(12px + var(--safe-left));
      bottom: calc(16px + var(--safe-bottom));
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(10, 22, 40, 0.55);
      backdrop-filter: blur(8px);
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      animation: fadeIn 0.8s 0.6s both;
      max-width: min(220px, 40vw);
    }

    .loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background:
        radial-gradient(ellipse 70% 50% at 50% 45%, #1a4a6e 0%, transparent 50%),
        var(--bg-void);
      z-index: 30;
      transition: opacity 0.45s ease, visibility 0.45s;
    }

    .loading.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-brand {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(1.8rem, 5vw, 2.4rem);
      letter-spacing: -0.03em;
      animation: pulseBrand 1.6s ease-in-out infinite;
    }

    .loading-bar {
      width: 120px;
      height: 3px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.1);
      overflow: hidden;
    }

    .loading-bar::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      animation: loadSlide 1.1s ease-in-out infinite;
    }

    .loading p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(16px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes pulseBrand {
      0%, 100% { opacity: 0.75; }
      50% { opacity: 1; }
    }
    @keyframes loadSlide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(280%); }
    }

    /* 响应式 */
    @media (max-width: 640px) {
      .top-bar {
        flex-wrap: wrap;
        gap: 8px;
      }
      .brand { padding: 8px 12px; }
      .brand-name { font-size: 1rem; }
      .brand-tag { display: none; }
      .search-wrap {
        order: 3;
        flex: 1 1 100%;
        max-width: none;
      }
      .controls {
        top: auto;
        bottom: calc(72px + var(--safe-bottom));
        right: calc(10px + var(--safe-right));
      }
      .layer-btn { width: 132px; font-size: 0.8rem; padding: 8px 10px; }
      .hint { display: none; }
      .coord-toast { bottom: calc(16px + var(--safe-bottom)); font-size: 0.82rem; }
    }

    @media (max-width: 380px) {
      .layer-btn { width: 120px; }
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>

  <div class="loading" id="loading">
    <div class="loading-brand">map.cq.je</div>
    <div class="loading-bar"></div>
    <p>正在加载 3D 地球…</p>
  </div>

  <div class="ui">
    <header class="top-bar">
      <div class="brand" aria-label="map.cq.je">
        <span class="brand-name">map.cq.je</span>
        <span class="brand-tag">3D Earth</span>
      </div>

      <div class="search-wrap">
        <form class="search-box" id="searchForm" autocomplete="off">
          <input
            id="searchInput"
            type="search"
            placeholder="搜索地点…"
            enterkeyhint="search"
            aria-label="搜索地点"
          />
          <button type="submit" class="btn btn-accent btn-icon" aria-label="搜索" title="搜索">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
              <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
            </svg>
          </button>
        </form>
        <div class="search-results" id="searchResults" role="listbox"></div>
      </div>

      <button type="button" class="btn btn-icon" id="locateBtn" title="定位当前位置" aria-label="定位当前位置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
          <circle cx="12" cy="12" r="8"/>
        </svg>
      </button>
    </header>

    <aside class="controls" aria-label="图层与视角">
      <div class="panel">
        <div class="panel-label">底图图层</div>
        <button type="button" class="btn layer-btn active" data-layer="satellite">
          <span class="dot"></span> 卫星图
        </button>
        <button type="button" class="btn layer-btn" data-layer="osm">
          <span class="dot"></span> 街道图
        </button>
        <button type="button" class="btn layer-btn" data-layer="topo">
          <span class="dot"></span> 地形图
        </button>
      </div>
      <div class="panel">
        <div class="panel-label">效果</div>
        <button type="button" class="btn layer-btn" id="terrainBtn" aria-pressed="false">
          <span class="dot"></span> 地形
        </button>
        <button type="button" class="btn layer-btn" id="atmosBtn" aria-pressed="true">
          <span class="dot"></span> 大气
        </button>
      </div>
    </aside>

    <div class="hint">拖拽旋转 · 滚轮缩放 · 右键/双指倾斜</div>
    <div class="coord-toast" id="coordToast" role="status"></div>
  </div>

  <script>
    (async function () {
      "use strict";

      // ========== 配置 ==========
      // Esri World Imagery API Key（部署前替换为真实 Key）
      const ESRI_API_KEY = "YOUR_ESRI_API_KEY";

      // 可选：Cesium Ion Token（开启地形 WorldTerrain 时需要）
      // 申请：https://ion.cesium.com/ — 未配置时不要写入占位符，避免 Ion 请求失败
      const CESIUM_ION_TOKEN = "YOUR_CESIUM_ION_TOKEN";
      if (CESIUM_ION_TOKEN && CESIUM_ION_TOKEN !== "YOUR_CESIUM_ION_TOKEN") {
        Cesium.Ion.defaultAccessToken = CESIUM_ION_TOKEN;
      }

      const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)
        || Math.min(window.innerWidth, window.innerHeight) < 600;

      const loadingEl = document.getElementById("loading");
      const coordToast = document.getElementById("coordToast");
      let toastTimer = null;

      function showToast(html, ms) {
        coordToast.innerHTML = html;
        coordToast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          coordToast.classList.remove("show");
        }, ms || 4500);
      }

      let loadingHidden = false;
      function hideLoading() {
        if (loadingHidden) return;
        loadingHidden = true;
        loadingEl.classList.add("hide");
      }

      // ========== 性能：全局请求调度（参照 Cesium Performance / MapLibre 并发控制） ==========
      // 限制每服务器并发瓦片请求，避免移动端带宽打满导致卡顿
      Cesium.RequestScheduler.maximumRequestsPerServer = isMobile ? 4 : 6;
      Cesium.RequestScheduler.throttleRequests = true;

      // ========== 底图：用 UrlTemplate 直连瓦片（避免 ArcGis 同步构造在 Cesium 1.104+ 的 getDerivedResource 错误） ==========
      function makeEsriImagery() {
        const hasKey = ESRI_API_KEY && ESRI_API_KEY !== "YOUR_ESRI_API_KEY";
        // Esri 公开 XYZ 瓦片；有 Key 时走 basemaps API
        const base = hasKey
          ? "https://ibasemaps-api.arcgis.com/arcgis/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}?token=" +
            encodeURIComponent(ESRI_API_KEY)
          : "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}";
        return new Cesium.UrlTemplateImageryProvider({
          url: base,
          credit: "© Esri World Imagery",
          // 限制最大级别，避免无效超清请求
          maximumLevel: isMobile ? 17 : 19,
        });
      }

      function makeOsmImagery() {
        return new Cesium.UrlTemplateImageryProvider({
          url: "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
          credit: "© OpenStreetMap contributors",
          maximumLevel: 19,
        });
      }

      function makeTopoImagery() {
        return new Cesium.UrlTemplateImageryProvider({
          url: "https://services.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}",
          credit: "© Esri World Topo Map",
          maximumLevel: isMobile ? 16 : 18,
        });
      }

      // ========== Viewer：精简默认控件，快速出球 ==========
      let viewer;
      try {
        viewer = new Cesium.Viewer("cesiumContainer", {
          animation: false,
          timeline: false,
          baseLayerPicker: false,
          geocoder: false,
          homeButton: false,
          sceneModePicker: false,
          navigationHelpButton: false,
          fullscreenButton: false,
          vrButton: false,
          infoBox: false,
          selectionIndicator: false,
          // 首屏直接挂卫星底图，减少空白等待
          baseLayer: new Cesium.ImageryLayer(makeEsriImagery()),
          // 默认关闭地形：地形带宽大，按需开启（见地形按钮）
          terrainProvider: new Cesium.EllipsoidTerrainProvider(),
          // 请求渲染模式：静止时不重绘，省电省 GPU（交互时自动唤醒）
          requestRenderMode: true,
          maximumRenderTimeChange: Infinity,
          // 目标帧率；移动端略降有助于手势流畅
          targetFrameRate: isMobile ? 30 : 60,
          msaaSamples: isMobile ? 1 : 4,
          contextOptions: {
            webgl: {
              alpha: false,
              antialias: !isMobile,
              powerPreference: "high-performance",
            },
          },
        });
      } catch (err) {
        loadingEl.querySelector("p").textContent =
          "WebGL 初始化失败，请使用支持硬件加速的现代浏览器。";
        console.error(err);
        return;
      }

      const scene = viewer.scene;
      const globe = scene.globe;
      const camera = viewer.camera;

      // ========== 地球与渲染性能参数 ==========
      // maximumScreenSpaceError：越大瓦片越少、越糊，性能越好。官方默认约 2
      globe.maximumScreenSpaceError = isMobile ? 4 : 2;
      // tileCacheSize：内存中缓存的瓦片数，过大占内存，过小反复请求
      globe.tileCacheSize = isMobile ? 60 : 100;
      // preloadWhenHidden：隐藏图层时不预加载，节省带宽（图层切换策略类似 MapLibre）
      globe.preloadWhenHidden = false;
      // 首屏优先显示低精度瓦片，尽快「出球」
      globe.preloadSiblings = false;

      // 简化非必要效果（大气默认开一点氛围；光照/雾默认关）
      scene.skyAtmosphere.show = true;
      scene.fog.enabled = false;
      globe.enableLighting = false;
      globe.showGroundAtmosphere = true;
      scene.moon.show = false;
      scene.sun.show = false;
      scene.shadowMap.enabled = false;

      // 背景色与容器一致，避免 WebGL 清屏闪白
      scene.backgroundColor = Cesium.Color.fromCssColorString("#0a1628");
      globe.baseColor = Cesium.Color.fromCssColorString("#1a3a5c");

      // 移动端手势：惯性与灵敏度微调，减少卡顿感
      const controller = scene.screenSpaceCameraController;
      controller.inertiaSpin = 0.8;
      controller.inertiaTranslate = 0.8;
      controller.inertiaZoom = 0.7;
      controller.minimumZoomDistance = 200;
      controller.maximumZoomDistance = 4e7;
      // 启用倾斜（类似谷歌地球 / 苹果地图）
      controller.enableTilt = true;
      controller.enableLook = true;
      controller.zoomEventTypes = [
        Cesium.CameraEventType.WHEEL,
        Cesium.CameraEventType.PINCH,
      ];
      controller.tiltEventTypes = [
        Cesium.CameraEventType.RIGHT_DRAG,
        Cesium.CameraEventType.PINCH,
        { eventType: Cesium.CameraEventType.LEFT_DRAG, modifier: Cesium.KeyboardEventModifier.CTRL },
        { eventType: Cesium.CameraEventType.LEFT_DRAG, modifier: Cesium.KeyboardEventModifier.SHIFT },
      ];

      // ========== 图层切换（卫星已作为 baseLayer；其它按需添加，MapLibre 式懒加载） ==========
      const layers = {
        satellite: viewer.imageryLayers.get(0),
        osm: null,
        topo: null,
      };
      let activeLayerKey = "satellite";

      const layerFactories = {
        satellite: makeEsriImagery,
        osm: makeOsmImagery,
        topo: makeTopoImagery,
      };

      function switchLayer(key) {
        if (key === activeLayerKey) return;
        // 隐藏当前层（preloadWhenHidden=false，不会继续拉瓦片）
        if (layers[activeLayerKey]) layers[activeLayerKey].show = false;

        if (!layers[key]) {
          layers[key] = viewer.imageryLayers.addImageryProvider(layerFactories[key]());
        }
        layers[key].show = true;
        activeLayerKey = key;

        document.querySelectorAll("[data-layer]").forEach(function (btn) {
          btn.classList.toggle("active", btn.getAttribute("data-layer") === key);
        });
        scene.requestRender();
      }

      document.querySelectorAll("[data-layer]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          switchLayer(btn.getAttribute("data-layer"));
        });
      });

      // ========== 按需效果：地形 / 大气 ==========
      let terrainOn = false;
      const terrainBtn = document.getElementById("terrainBtn");
      terrainBtn.addEventListener("click", async function () {
        const hasIon =
          CESIUM_ION_TOKEN && CESIUM_ION_TOKEN !== "YOUR_CESIUM_ION_TOKEN";
        if (!terrainOn && !hasIon) {
          showToast("请先在代码中配置有效的 Cesium Ion Token 再开启地形");
          return;
        }
        terrainOn = !terrainOn;
        terrainBtn.classList.toggle("active", terrainOn);
        terrainBtn.setAttribute("aria-pressed", String(terrainOn));
        try {
          if (terrainOn) {
            viewer.terrainProvider = await Cesium.createWorldTerrainAsync({
              requestVertexNormals: false,
              requestWaterMask: false,
            });
          } else {
            viewer.terrainProvider = new Cesium.EllipsoidTerrainProvider();
          }
        } catch (e) {
          terrainOn = false;
          terrainBtn.classList.remove("active");
          terrainBtn.setAttribute("aria-pressed", "false");
          showToast("地形加载失败：请检查 Cesium Ion Token");
        }
        scene.requestRender();
      });

      let atmosOn = true;
      const atmosBtn = document.getElementById("atmosBtn");
      atmosBtn.classList.add("active");
      atmosBtn.addEventListener("click", function () {
        atmosOn = !atmosOn;
        atmosBtn.classList.toggle("active", atmosOn);
        atmosBtn.setAttribute("aria-pressed", String(atmosOn));
        scene.skyAtmosphere.show = atmosOn;
        globe.showGroundAtmosphere = atmosOn;
        scene.requestRender();
      });

      // ========== 初始视角：快速看到完整地球 ==========
      camera.setView({
        destination: Cesium.Cartesian3.fromDegrees(104.0, 28.0, 1.8e7),
        orientation: {
          heading: 0,
          pitch: Cesium.Math.toRadians(-90),
          roll: 0,
        },
      });

      // 首帧 / 瓦片就绪后隐藏 loading；兜底避免长时间遮罩
      scene.globe.tileLoadProgressEvent.addEventListener(function (queued) {
        if (queued === 0) hideLoading();
      });
      setTimeout(hideLoading, 2500);
      scene.postRender.addEventListener(function onFirst() {
        hideLoading();
        scene.postRender.removeEventListener(onFirst);
      });

      // ========== 点击显示坐标 ==========
      const handler = new Cesium.ScreenSpaceEventHandler(scene.canvas);
      let pickEntity = null;

      handler.setInputAction(function (click) {
        const cartesian = camera.pickEllipsoid(click.position, globe.ellipsoid);
        if (!cartesian) return;
        const carto = Cesium.Cartographic.fromCartesian(cartesian);
        const lon = Cesium.Math.toDegrees(carto.longitude);
        const lat = Cesium.Math.toDegrees(carto.latitude);

        if (pickEntity) viewer.entities.remove(pickEntity);
        pickEntity = viewer.entities.add({
          position: cartesian,
          point: {
            pixelSize: 10,
            color: Cesium.Color.fromCssColorString("#3db8a0"),
            outlineColor: Cesium.Color.WHITE,
            outlineWidth: 2,
            disableDepthTestDistance: Number.POSITIVE_INFINITY,
          },
        });
        scene.requestRender();

        showToast(
          "<strong>坐标</strong><br/>经度 " +
            lon.toFixed(6) +
            "° · 纬度 " +
            lat.toFixed(6) +
            "°"
        );
      }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

      // ========== 地点搜索（Nominatim；生产可换自建/商业地理编码） ==========
      const searchForm = document.getElementById("searchForm");
      const searchInput = document.getElementById("searchInput");
      const searchResults = document.getElementById("searchResults");
      let searchAbort = null;
      let debounceTimer = null;

      function closeResults() {
        searchResults.classList.remove("open");
        searchResults.innerHTML = "";
      }

      async function doSearch(q) {
        if (!q || q.trim().length < 2) {
          closeResults();
          return;
        }
        if (searchAbort) searchAbort.abort();
        searchAbort = new AbortController();
        try {
          const url =
            "https://nominatim.openstreetmap.org/search?format=json&limit=6&q=" +
            encodeURIComponent(q.trim());
          const res = await fetch(url, {
            signal: searchAbort.signal,
            headers: { Accept: "application/json" },
          });
          if (!res.ok) throw new Error("search failed");
          renderResults(await res.json());
        } catch (e) {
          if (e.name !== "AbortError") showToast("搜索失败，请稍后重试");
        }
      }

      function renderResults(items) {
        searchResults.innerHTML = "";
        if (!items.length) {
          searchResults.innerHTML =
            '<button type="button" class="search-item" disabled>未找到结果</button>';
          searchResults.classList.add("open");
          return;
        }
        items.forEach(function (item) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "search-item";
          btn.setAttribute("role", "option");
          const name = item.display_name.split(",")[0];
          btn.innerHTML = name + "<small>" + item.display_name + "</small>";
          btn.addEventListener("click", function () {
            flyTo(parseFloat(item.lon), parseFloat(item.lat), item.display_name);
            closeResults();
            searchInput.blur();
          });
          searchResults.appendChild(btn);
        });
        searchResults.classList.add("open");
      }

      function flyTo(lon, lat, label) {
        camera.flyTo({
          destination: Cesium.Cartesian3.fromDegrees(lon, lat, 8000),
          orientation: {
            heading: 0,
            pitch: Cesium.Math.toRadians(-45),
            roll: 0,
          },
          duration: 1.6,
          complete: function () {
            scene.requestRender();
          },
        });
        if (pickEntity) viewer.entities.remove(pickEntity);
        pickEntity = viewer.entities.add({
          position: Cesium.Cartesian3.fromDegrees(lon, lat),
          point: {
            pixelSize: 12,
            color: Cesium.Color.fromCssColorString("#3db8a0"),
            outlineColor: Cesium.Color.WHITE,
            outlineWidth: 2,
            disableDepthTestDistance: Number.POSITIVE_INFINITY,
          },
          label: label
            ? {
                text: label.split(",")[0],
                font: "600 14px Outfit, sans-serif",
                fillColor: Cesium.Color.WHITE,
                outlineColor: Cesium.Color.fromCssColorString("#0a1628"),
                outlineWidth: 3,
                style: Cesium.LabelStyle.FILL_AND_OUTLINE,
                verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
                pixelOffset: new Cesium.Cartesian2(0, -14),
                disableDepthTestDistance: Number.POSITIVE_INFINITY,
              }
            : undefined,
        });
        showToast(
          "<strong>" + (label ? label.split(",")[0] : "目标") + "</strong><br/>已飞往该位置"
        );
      }

      searchForm.addEventListener("submit", function (e) {
        e.preventDefault();
        doSearch(searchInput.value);
      });

      searchInput.addEventListener("input", function () {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(function () {
          doSearch(searchInput.value);
        }, 380);
      });

      document.addEventListener("click", function (e) {
        if (!e.target.closest(".search-wrap")) closeResults();
      });

      // ========== 定位当前位置 ==========
      const locateBtn = document.getElementById("locateBtn");
      locateBtn.addEventListener("click", function () {
        if (!navigator.geolocation) {
          showToast("当前浏览器不支持定位");
          return;
        }
        locateBtn.disabled = true;
        showToast("正在获取位置…", 8000);
        navigator.geolocation.getCurrentPosition(
          function (pos) {
            locateBtn.disabled = false;
            flyTo(pos.coords.longitude, pos.coords.latitude, "我的位置");
          },
          function () {
            locateBtn.disabled = false;
            showToast("定位失败：请检查浏览器定位权限");
          },
          { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 }
        );
      });

      window.addEventListener("resize", function () {
        scene.requestRender();
      });

      // 交互时确保渲染唤醒（requestRenderMode 下）
      ["pointerdown", "wheel", "touchstart"].forEach(function (evt) {
        scene.canvas.addEventListener(
          evt,
          function () {
            scene.requestRender();
          },
          { passive: true }
        );
      });

      // 暴露给自动化测试（可选）
      window.__mapApp = { viewer, switchLayer, flyTo, showToast };
    })();
  </script>
</body>
</html>
